<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Parallax — Codex and Claude Code, in one workspace</title>
  <desc id="desc">A luminous cyan and violet orbital mark beside the Parallax wordmark and the line Two minds. One codebase. Sharper judgment.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C1B"/>
      <stop offset="0.56" stop-color="#10132C"/>
      <stop offset="1" stop-color="#151033"/>
    </linearGradient>
    <linearGradient id="signalA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FFAE8"/>
      <stop offset="1" stop-color="#39BDFE"/>
    </linearGradient>
    <linearGradient id="signalB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B78AFF"/>
      <stop offset="1" stop-color="#FF86B8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2FFFB"/>
      <stop offset="0.5" stop-color="#9CE5FF"/>
      <stop offset="1" stop-color="#DBB9FF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#B4B7FF" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#655FDD" stop-opacity=".16"/>
      <stop offset="1" stop-color="#655FDD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#AAB7F6" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="30" fill="url(#background)"/>
  <rect width="1280" height="520" rx="30" fill="url(#grid)"/>
  <path d="M0 407C249 315 378 471 602 377S1016 278 1280 387" fill="none" stroke="#8994E3" stroke-opacity=".10" stroke-width="1.5"/>
  <path d="M0 438C259 347 404 488 623 407S1031 317 1280 408" fill="none" stroke="#8994E3" stroke-opacity=".08" stroke-width="1.5"/>
  <circle cx="1000" cy="260" r="248" fill="url(#halo)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="66" y="62" width="175" height="34" rx="17" fill="#BFB5FF" fill-opacity=".10" stroke="#BFB5FF" stroke-opacity=".40"/>
    <circle cx="83" cy="79" r="4" fill="#A8F3EC"/>
    <text x="97" y="84" fill="#D9D5FF" font-size="13" font-weight="700" letter-spacing="1.5">FIRST CONTACT</text>

    <text x="60" y="253" fill="#F7F6FF" font-size="96" font-weight="850" letter-spacing="-7">PARALLAX</text>
    <rect x="66" y="282" width="53" height="4" rx="2" fill="url(#signalA)"/>
    <rect x="126" y="282" width="31" height="4" rx="2" fill="url(#signalB)"/>
    <text x="66" y="339" fill="#E7E7F8" font-size="28" font-weight="600" letter-spacing="-.5">Two minds. One codebase.</text>
    <text x="66" y="377" fill="#A8ADD1" font-size="28" font-weight="500" letter-spacing="-.5">Sharper judgment.</text>

    <text x="66" y="462" fill="#7881B0" font-size="13" font-weight="700" letter-spacing="2.2">CODEX × CLAUDE CODE  /  LOCAL COLLABORATION</text>
  </g>

  <g transform="translate(997 261)">
    <circle r="169" fill="none" stroke="#8288C9" stroke-opacity=".21" stroke-width="1"/>
    <circle r="133" fill="none" stroke="#A1A6ED" stroke-opacity=".18" stroke-width="1" stroke-dasharray="3 8"/>
    <circle r="90" fill="none" stroke="#A1A6ED" stroke-opacity=".15" stroke-width="1"/>

    <path d="M-155 68C-123-53-34-146 102-131C185-122 198-67 183-16" fill="none" stroke="url(#signalA)" stroke-width="12" stroke-linecap="round" opacity=".28" filter="url(#glow)"/>
    <path d="M-155 68C-123-53-34-146 102-131C185-122 198-67 183-16" fill="none" stroke="url(#signalA)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M155-68C123 53 34 146-102 131C-185 122-198 67-183 16" fill="none" stroke="url(#signalB)" stroke-width="12" stroke-linecap="round" opacity=".28" filter="url(#glow)"/>
    <path d="M155-68C123 53 34 146-102 131C-185 122-198 67-183 16" fill="none" stroke="url(#signalB)" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M-134-98L0 0L129 90" fill="none" stroke="#83EBEA" stroke-opacity=".42" stroke-width="1.5"/>
    <path d="M134-98L0 0L-129 90" fill="none" stroke="#C9A5F4" stroke-opacity=".42" stroke-width="1.5"/>

    <circle cx="-134" cy="-98" r="13" fill="#78E7E0" opacity=".55" filter="url(#softGlow)"/>
    <circle cx="-134" cy="-98" r="6" fill="#9BFFF0"/>
    <circle cx="134" cy="-98" r="13" fill="#C596FB" opacity=".55" filter="url(#softGlow)"/>
    <circle cx="134" cy="-98" r="6" fill="#E2BBFF"/>
    <circle cx="-129" cy="90" r="3" fill="#B090F8"/>
    <circle cx="129" cy="90" r="3" fill="#85E8F1"/>

    <circle r="56" fill="#C6BFFF" opacity=".25" filter="url(#glow)"/>
    <path d="M0-46L46 0L0 46L-46 0Z" fill="#111936" stroke="url(#core)" stroke-width="2.5"/>
    <path d="M0-26L26 0L0 26L-26 0Z" fill="url(#core)" opacity=".92"/>
    <circle r="6" fill="#FFFFFF"/>
  </g>

  <rect x=".75" y=".75" width="1278.5" height="518.5" rx="29.25" fill="none" stroke="#C2BFFF" stroke-opacity=".16" stroke-width="1.5"/>
</svg>

name: Validate Constellation
on:
  push:
  pull_request:
jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Deterministic provider, isolation, recovery and compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Validate synchronized manifests and launchers
        run: python scripts/validate_release.py
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - name: Packaged assets match the source build
        run: git diff --exit-code -- src/parallax/static

name: Validate Constellation
on:
  push:
    branches-ignore: [claude-code-plugin]
  pull_request:
jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux command isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install locked runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Deterministic provider, isolation, recovery and compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Validate synchronized manifests and launchers
        run: python scripts/validate_release.py
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - name: Recorded graph inspection and process lifecycle tests
        run: npm test
        working-directory: studio
      - name: Packaged assets match the source build
        run: git diff --exit-code -- src/parallax/static
      - name: Hosted entry and Vercel routing tests
        run: npm run test:hosted
        working-directory: studio
      - name: Build default Vercel entry
        run: node scripts/build_vercel.mjs
      - name: Build Railway-backed Studio
        run: node scripts/build_vercel.mjs
        env:
          PARALLAX_RUNTIME_URL: https://runtime.example.com
      - name: Hosted builds preserve packaged assets
        run: git diff --exit-code -- src/parallax/static
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the public Docker Hub cache
        # Google-managed cache of the same upstream images; Docker falls back
        # to Docker Hub for a cache miss. Keep the pinned Dockerfile unchanged.
        # https://docs.cloud.google.com/artifact-registry/docs/pull-cached-dockerhub-images
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          config["registry-mirrors"] = list(dict.fromkeys(["https://mirror.gcr.io", *config.get("registry-mirrors", [])]))
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
      - name: Build Railway image
        run: docker build -t parallax-runtime .
      - name: Container health and authenticated access smoke test
        run: python scripts/smoke_container.py
  claude-plugin:
    # Anthropic's directory installs the folder holding .claude-plugin/plugin.json, so it tracks a branch that holds
    # only the Claude Code plugin. It is rebuilt from main after every check passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [runtime, studio, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: claude-code-plugin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the directory plugin
        run: python scripts/build_claude_plugin.py --out "$RUNNER_TEMP/plugin"
      - name: Publish to the claude-code-plugin branch
        env:
          SOURCE: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin claude-code-plugin >/dev/null; then
            git fetch origin claude-code-plugin
            git worktree add -B claude-code-plugin "$RUNNER_TEMP/branch" origin/claude-code-plugin
          else
            git worktree add --orphan -b claude-code-plugin "$RUNNER_TEMP/branch"
          fi
          rsync -a --delete --exclude .git "$RUNNER_TEMP/plugin/" "$RUNNER_TEMP/branch/"
          cd "$RUNNER_TEMP/branch"
          git add -A
          if git diff --cached --quiet; then
            echo "The plugin branch already matches $SOURCE."
            exit 0
          fi
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          git commit -q -m "parallax-team $version from ${SOURCE::7}"
          git push origin claude-code-plugin

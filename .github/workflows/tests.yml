name: Validate Constellation
on:
  push:
  pull_request:
jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux command isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install locked runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Deterministic provider, isolation, recovery and compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Validate synchronized manifests and launchers
        run: python scripts/validate_release.py
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - name: Recorded graph inspection and process lifecycle tests
        run: npm test
        working-directory: studio
      - name: Packaged assets match the source build
        run: git diff --exit-code -- src/parallax/static
      - name: Hosted entry and Vercel routing tests
        run: npm run test:hosted
        working-directory: studio
      - name: Build default Vercel entry
        run: node scripts/build_vercel.mjs
      - name: Build Railway-backed Studio
        run: node scripts/build_vercel.mjs
        env:
          PARALLAX_RUNTIME_URL: https://runtime.example.com
      - name: Hosted builds preserve packaged assets
        run: git diff --exit-code -- src/parallax/static
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Railway image
        run: docker build -t parallax-runtime .
      - name: Container health and authenticated access smoke test
        run: python scripts/smoke_container.py
